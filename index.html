<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký suất cơm theo tuần</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>ĐĂNG KÝ CƠM THEO TUẦN</h1>
    </header>

    <main class="main-content">
      <!-- FORM ĐĂNG KÝ BẢNG -->
      <section class="card form-card">
        <form id="mealForm">
          <input type="hidden" id="name" name="name">

          <!-- BẢNG LỊCH ĐĂNG KÝ -->
          <div class="table-schedule-wrapper">
            <table class="schedule-table">
              <thead>
                <tr>
                  <th>Thứ / Ngày</th>
                  <th>☀️ Buổi Trưa</th>
                  <th>🌙 Buổi Tối</th>
                </tr>
              </thead>
              <tbody id="weekScheduleBody">
                <!-- Javascript sẽ tự động render 7 ngày vào đây -->
              </tbody>
            </table>
          </div>

          <button type="submit" id="btnSubmit" class="btn-primary" style="margin-top: 16px;">💾 Lưu đăng ký tuần này</button>
        </form>
      </section>

      <!-- DANH SÁCH TỔNG HỢP -->
      <section class="card list-card">
        <div class="list-header">
          <h2>Danh sách đã đăng ký</h2>
          <button id="btnRefresh" class="btn-secondary">↺ Làm mới</button>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-num" id="statTotal">0</span>
            <span class="stat-label">Tổng suất</span>
          </div>
          <div class="stat-box">
            <span class="stat-num" id="statLunch">0</span>
            <span class="stat-label">Trưa</span>
          </div>
          <div class="stat-box">
            <span class="stat-num" id="statDinner">0</span>
            <span class="stat-label">Tối</span>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Tên</th>
                <th>Ngày</th>
                <th>Buổi</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="mealTableBody">
              <tr><td colspan="4" class="text-center">Đang tải...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
  <script src="app.js"></script>
</body>
</html>
